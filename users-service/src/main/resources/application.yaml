server:
  port: 0 # Porta aleatória (0) é útil quando usado com Eureka

spring:
  application:
    name: USERS-SERVICE

  datasource:
    url: jdbc:postgresql://localhost:5432/users_db
    driverClassName: org.postgresql.Driver
    username: postgres
    password: 123456

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: "YyN1cDIkUnNlY3VyZV8kM2NyM3QhX2tleV9mb3JfYXV0aGVudGljYXRpb25fMTIzNDU2Nzg5MA=="
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true