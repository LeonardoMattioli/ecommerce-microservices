server:
  port: 8085
spring:
  application:
    name: INVENTORY-SERVICE
  datasource:
    url: jdbc:postgresql://localhost:5432/inventory_db
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false